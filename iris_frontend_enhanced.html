<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS - Your AI Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ecf0f1;
            min-height: 100vh;
            overflow: hidden;
        }

        .tab-navigation {
            display: flex;
            gap: 0;
            justify-content: center;
            margin-top: 1rem;
            border-bottom: 2px solid rgba(255, 215, 0, 0.1);
        }

        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .tab-btn:hover {
            color: #FFD700;
        }

        .tab-btn.active {
            color: #FFD700;
            border-bottom-color: #FFD700;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .habits-container, .reflections-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .habits-header, .reflections-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .habit-form, .reflection-form {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: #ecf0f1;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .form-buttons button {
            flex: 1;
        }

        .habits-list, .reflections-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .habit-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid #FFD700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .habit-info {
            flex: 1;
        }

        .habit-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .habit-streak {
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .habit-actions {
            display: flex;
            gap: 0.5rem;
        }

        .habit-actions button {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .reflection-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid #FFD700;
        }

        .reflection-date {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-bottom: 0.3rem;
        }

        .reflection-content {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 0.5rem;
        }

        .reflection-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #bdc3c7;
        }

        .weekly-summary, .mood-trend {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .stat-item {
            background: rgba(255, 215, 0, 0.05);
            padding: 1rem;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #FFD700;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #bdc3c7;
            margin-top: 0.5rem;
        }

        .loading {
            text-align: center;
            color: #bdc3c7;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <!-- Habits Tab content for insertion -->
    <template id="habits-template">
        <div id="habits-tab" class="tab-content">
            <div class="habits-container">
                <div class="habits-header">
                    <h2>Today's Habits</h2>
                    <button class="btn btn-primary" onclick="showHabitForm()">+ New Habit</button>
                </div>

                <div id="habit-form" class="habit-form" style="display: none;">
                    <div class="form-group">
                        <label for="habit-name">Habit Name</label>
                        <input type="text" id="habit-name" placeholder="e.g., Morning Meditation">
                    </div>
                    <div class="form-group">
                        <label for="habit-description">Description</label>
                        <input type="text" id="habit-description" placeholder="Optional description">
                    </div>
                    <div class="form-group">
                        <label for="habit-category">Category</label>
                        <input type="text" id="habit-category" value="general" placeholder="e.g., health, mindfulness">
                    </div>
                    <div class="form-buttons">
                        <button type="button" class="btn btn-primary" onclick="createHabit()">Create</button>
                        <button type="button" class="btn btn-secondary" onclick="hideHabitForm()">Cancel</button>
                    </div>
                </div>

                <div id="today-habits" class="habits-list">
                    <p class="loading">Loading habits...</p>
                </div>

                <div class="weekly-summary" id="weekly-summary" style="display: none;">
                    <h3>Weekly Summary</h3>
                    <div id="weekly-stats"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Reflections Tab content for insertion -->
    <template id="reflections-template">
        <div id="reflections-tab" class="tab-content">
            <div class="reflections-container">
                <div class="reflections-header">
                    <h2>Reflections</h2>
                    <button class="btn btn-primary" onclick="showReflectionForm()">+ New Reflection</button>
                </div>

                <div id="reflection-form" class="reflection-form" style="display: none;">
                    <div class="form-group">
                        <label for="reflection-content">What's on your mind?</label>
                        <textarea id="reflection-content" placeholder="Share your thoughts..." rows="4"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="reflection-mood">Mood</label>
                            <select id="reflection-mood">
                                <option value="">-- Select --</option>
                                <option value="great">Great</option>
                                <option value="good">Good</option>
                                <option value="okay">Okay</option>
                                <option value="bad">Bad</option>
                                <option value="terrible">Terrible</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="reflection-energy">Energy</label>
                            <select id="reflection-energy">
                                <option value="">-- Select --</option>
                                <option value="1">1 - Very Low</option>
                                <option value="2">2 - Low</option>
                                <option value="3">3 - Medium</option>
                                <option value="4">4 - High</option>
                                <option value="5">5 - Very High</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-buttons">
                        <button type="button" class="btn btn-primary" onclick="createReflection()">Save</button>
                        <button type="button" class="btn btn-secondary" onclick="hideReflectionForm()">Cancel</button>
                    </div>
                </div>

                <div id="recent-reflections" class="reflections-list">
                    <p class="loading">Loading reflections...</p>
                </div>

                <div class="mood-trend" id="mood-trend" style="display: none;">
                    <h3>Mood Trend (30 days)</h3>
                    <div id="mood-stats"></div>
                </div>
            </div>
        </div>
    </template>

    <script>
        // Core habit and reflection functions
        async function loadTodayHabits() {
            try {
                const response = await fetch(` + "`${API_URL}`" + `/habits/today?token=${currentToken}`)
                const data = await response.json()
                const container = document.getElementById('today-habits')
                if (data.habits.length === 0) {
                    container.textContent = 'No habits. Create one to get started!'
                } else {
                    container.innerHTML = data.habits.map(h =>  ` + "`<div><span>${h.name}</span><button onclick=\"logCompletion(${h.id})\">Done</button></div>`" + `).join('')
                }
            } catch (e) {
                console.error(e)
            }
        }

        async function createReflection() {
            const content = document.getElementById('reflection-content').value
            if (!content.trim()) {
                alert('Please enter text')
                return
            }
            try {
                await fetch(` + "`${API_URL}`" + `/reflections?token=${currentToken}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: content,
                        mood: document.getElementById('reflection-mood').value || null,
                        energy_level: document.getElementById('reflection-energy').value || null
                    })
                })
                document.getElementById('reflection-content').value = ''
                alert('Saved!')
            } catch (e) {
                alert('Error: ' + e.message)
            }
        }
    </script>
</body>
</html>
