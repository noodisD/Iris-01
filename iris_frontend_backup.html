<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS - Your AI Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ecf0f1;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ============================================================
           LANDING PAGE
           ============================================================ */
        #landing-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .iris-title {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #FFD700, #FFC107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .iris-description {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #bdc3c7;
            max-width: 600px;
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(45deg, #FFD700, #FFC107);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateY(-2px);
        }

        /* ============================================================
           AUTH PAGE (Sign Up / Log In)
           ============================================================ */
        #auth-page {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .auth-container h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: #ecf0f1;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .auth-buttons-container {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .auth-buttons-container .btn {
            flex: 1;
        }

        .form-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .toggle-auth button {
            background: none;
            border: none;
            color: #FFD700;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }

        /* ============================================================
           CHAT PAGE
           ============================================================ */
        #chat-page {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.05) 0%, transparent 70%);
        }

        .chat-header {
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .chat-header h1 {
            font-size: 2rem;
            background: linear-gradient(45deg, #FFD700, #FFC107);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .message {
            max-width: 600px;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            word-wrap: break-word;
        }

        .message.user {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 193, 7, 0.3));
            align-self: flex-end;
            border-left: 3px solid #FFD700;
        }

        .message.iris {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 193, 7, 0.1));
            align-self: flex-start;
            border-left: 3px solid #FFD700;
        }

        .chat-input-area {
            padding: 2rem;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: flex-end;
        }

        .input-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 0.5rem;
        }

        .input-container input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: #ecf0f1;
            font-size: 1rem;
        }

        .input-container input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .btn-send {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(45deg, #FFD700, #FFC107);
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        .btn-logout {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-logout:hover {
            background: rgba(231, 76, 60, 0.1);
        }

        .greeting-message {
            text-align: center;
            color: #bdc3c7;
            margin-bottom: 2rem;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- ============================================================
         LANDING PAGE
         ============================================================ -->
    <div id="landing-page">
        <h1 class="iris-title">IRIS</h1>
        <p class="iris-description">
            Your personal AI companion that learns from your patterns,
            understands your conflicts, and guides you with narrative insight.
            A system that grows with you, adapts to you, and helps you understand yourself.
        </p>
        <div class="auth-buttons">
            <button class="btn btn-primary" onclick="goToAuth('signup')">Sign Up</button>
            <button class="btn btn-secondary" onclick="goToAuth('login')">Log In</button>
        </div>
    </div>

    <!-- ============================================================
         AUTH PAGE (Sign Up / Log In)
         ============================================================ -->
    <div id="auth-page">
        <div class="auth-container">
            <h2 id="auth-title">Sign Up</h2>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div class="form-error" id="auth-error"></div>

                <div class="auth-buttons-container">
                    <button type="submit" class="btn btn-primary" id="auth-submit-btn">Sign Up</button>
                    <button type="button" class="btn btn-secondary" onclick="goToLanding()">Back</button>
                </div>
            </form>

            <div class="toggle-auth">
                <p>
                    <span id="toggle-text">Already have an account?</span>
                    <button onclick="toggleAuth()">Click here</button>
                </p>
            </div>
        </div>
    </div>

    <!-- ============================================================
         CHAT PAGE
         ============================================================ -->
    <div id="chat-page">
        <button class="btn-logout" onclick="logout()">Logout</button>
        
        <div class="chat-header">
            <h1>IRIS</h1>
            <p id="user-greeting"></p>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="greeting-message">
                <p id="iris-greeting"></p>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-container">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Type your message... (or /help for commands)"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const API_URL = 'http://localhost:8000'
        let currentAuthMode = 'signup'
        let currentUser = null
        let currentToken = null

        // ============================================================
        // PAGE NAVIGATION
        // ============================================================
        function showPage(pageId) {
            document.getElementById('landing-page').style.display = 'none'
            document.getElementById('auth-page').style.display = 'none'
            document.getElementById('chat-page').style.display = 'none'

            document.getElementById(pageId).style.display = pageId === 'chat-page' ? 'flex' : 'flex'
        }

        function goToLanding() {
            showPage('landing-page')
        }

        function goToAuth(mode) {
            currentAuthMode = mode
            const title = mode === 'signup' ? 'Sign Up' : 'Log In'
            const submitText = mode === 'signup' ? 'Sign Up' : 'Log In'
            const toggleText = mode === 'signup' ? 'Already have an account?' : 'Need an account?'

            document.getElementById('auth-title').textContent = title
            document.getElementById('auth-submit-btn').textContent = submitText
            document.getElementById('toggle-text').textContent = toggleText

            document.getElementById('auth-error').style.display = 'none'
            document.getElementById('username').value = ''
            document.getElementById('password').value = ''

            showPage('auth-page')
        }

        function toggleAuth() {
            currentAuthMode = currentAuthMode === 'signup' ? 'login' : 'signup'
            goToAuth(currentAuthMode)
        }

        // ============================================================
        // AUTHENTICATION
        // ============================================================
        async function handleAuth(event) {
            event.preventDefault()

            const username = document.getElementById('username').value
            const password = document.getElementById('password').value
            const endpoint = currentAuthMode === 'signup' ? '/auth/signup' : '/auth/login'

            try {
                const response = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                })

                const data = await response.json()

                if (!response.ok) {
                    throw new Error(data.detail || 'Authentication failed')
                }

                // Store token and username
                currentToken = data.access_token
                currentUser = data.username
                localStorage.setItem('access_token', currentToken)
                localStorage.setItem('username', currentUser)

                // Go to chat
                initializeChat()
                showPage('chat-page')

            } catch (error) {
                console.error('Auth error:', error)
                document.getElementById('auth-error').textContent = error.message
                document.getElementById('auth-error').style.display = 'block'
            }
        }

        function logout() {
            currentToken = null
            currentUser = null
            localStorage.removeItem('access_token')
            localStorage.removeItem('username')
            goToLanding()
        }

        // ============================================================
        // CHAT
        // ============================================================
        function initializeChat() {
            const chatContainer = document.getElementById('chat-container')
            chatContainer.innerHTML = `
                <div class="greeting-message">
                    <p id="iris-greeting"></p>
                </div>
            `
            
            document.getElementById('user-greeting').textContent = `Welcome back, ${currentUser}`
            document.getElementById('iris-greeting').textContent = `Hello ${currentUser}. I'm IRIS, your personal AI companion. Tell me what's on your mind.`
        }

        async function sendMessage() {
            const messageInput = document.getElementById('message-input')
            const message = messageInput.value.trim()

            if (!message) return

            // Add user message to UI
            addMessageToUI(message, 'user')
            messageInput.value = ''

            try {
                // Send to API
                const response = await fetch(API_URL + '/chat/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        token: currentToken
                    })
                })

                const data = await response.json()

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to send message')
                }

                // Add IRIS response to UI
                addMessageToUI(data.message, 'iris')

            } catch (error) {
                console.error('Chat error:', error)
                addMessageToUI(`Error: ${error.message}`, 'iris')
            }
        }

        function addMessageToUI(message, sender) {
            const chatContainer = document.getElementById('chat-container')
            const messageDiv = document.createElement('div')
            messageDiv.className = `message ${sender}`
            messageDiv.textContent = message

            chatContainer.appendChild(messageDiv)
            chatContainer.scrollTop = chatContainer.scrollHeight
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        window.addEventListener('load', function() {
            // Check if user is already logged in
            const token = localStorage.getItem('access_token')
            const username = localStorage.getItem('username')

            if (token && username) {
                currentToken = token
                currentUser = username
                initializeChat()
                showPage('chat-page')
            } else {
                showPage('landing-page')
            }
        })
    </script>
</body>
</html>
