[project]
name = "iris-minimal"
version = "0.1.0"
description = "IRIS Companion v2.1: The Epistemic Mirror - A local-first, multi-user AI companion built on a deterministic analytical spine"
authors = [{name = "noodis", email = "noodis@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    # Core LLM
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",

    # Data & Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Databases
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.5",

    # ML / Clustering
    "scikit-learn>=1.5.0",
    "numpy>=2.1.0",

    # Core application dependencies
    "typing-extensions>=4.8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.14.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.6",
]

[project.scripts]
iris = "companion:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.14.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.6",
]

[tool.black]
line-length = 100
target-version = ['py314']

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "C9", "DTZ", "G", "PGH", "PIE", "PL", "PT", "PYI", "RUF", "SIM", "UP", "W", "EXE"]
ignore = ["PLR"]  # Design related pylint codes
