[tool.poetry]
name = "iris-minimal"
version = "0.1.0"
description = "IRIS Minimal Companion - Chat + Journal (5 core modules)"
authors = ["noodis <noodis@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "agent"}]

[tool.poetry.dependencies]
python = "^3.10"

# Core LLM
openai = "^1.0.0"
google-generativeai = "^0.3.0"

# Data
pydantic = "^2.8.0"
python-dotenv = "^1.0.0"

# Databases
psycopg2-binary = "^2.9.0"
neo4j = "^5.20.0"
chromadb = "^0.5.0"

# ML / Clustering
scikit-learn = "^1.3.0"
hdbscan = "^0.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.14.0"
black = "^23.0.0"

[tool.poetry.scripts]
iris = "companion:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
