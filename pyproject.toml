[tool.poetry]
name = "iris-minimal"
version = "0.1.0"
description = "IRIS Companion v2.1: The Epistemic Mirror - A local-first, multi-user AI companion built on a deterministic analytical spine"
authors = ["noodis <noodis@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "agent"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# Core LLM
openai = "^1.50.0"
google-generativeai = "^0.8.0"  # Re-enabled with working scikit-learn

# Data & Validation
pydantic = "^2.8.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"

# Databases
psycopg2-binary = "^2.9.0"
pgvector = "^0.2.5"
neo4j = "^5.20.0"
# Use a specific version of chromadb that doesn't have telemetry issues
# Using a version that might have better Python 3.14 compatibility
# Temporarily commenting out due to onnxruntime incompatibility with Python 3.14
# chromadb = "^0.4.24"  # Re-enabling with older version that may have fewer dependencies

# ML / Clustering
scikit-learn = "^1.5.0"  # Using version that may support Python 3.14 with fallback
# HDBSCAN - Using ^0.8.27 which allows up to 0.8.x (currently 0.8.41 in lock file)
# Note: hdbscan has upstream deprecation warnings in their code (not fixable by us)
# hdbscan = "^0.8.27"
numpy = "^2.1.0"  # Using version that may support Python 3.14

# Core application dependencies
typing-extensions = "^4.8.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.12"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-mock = "^3.14.0"
black = "^23.0.0"
mypy = "^1.0.0"
ruff = "^0.1.6"

[tool.poetry.scripts]
iris = "companion:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py314']

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "C9", "DTZ", "G", "PGH", "PIE", "PL", "PT", "PYI", "RUF", "SIM", "UP", "W", "EXE"]
ignore = ["PLR"]  # Design related pylint codes
